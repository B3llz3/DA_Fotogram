<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram - Your personal photo album</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <img src="./img/logo_header.png" alt="Fotogram" width="168" height="32" />
    </header>
    <main>
      <h1>Your personal photo album</h1>
      <div class="gallery" id="gallery">
        <button type="button" class="gallery-item">
          <img
            src="./img/images/alaska-810433_1280.jpg"
            alt="Panoramic view of a lake and mountains in Alaska"
            class="gallery-image"
          />
        </button>
        <button type="button" class="gallery-item">
          <img
            src="./img/images/anime-8788959_1280.jpg"
            alt="city in anime style"
            class="gallery-image"
          />
        </button>
      </div>
    </main>
    <footer>
      <img
        src="./img/logo_da_footer.png"
        alt="Developer Akademie"
        width="134"
        height="32"
      />
      <p>&copy; 2023 Developer Akademie GmbH</p>
    </footer>
  </body>
</html>
